# Builds all three surfaces and deploys one GitHub Pages site:
#
#   /            the PWA (app/dist), as always
#   /vscode/     the VS Code web extension, unpacked — installed with
#                "Developer: Install Extension From Location…"
#   /cli/        the CLI's npm tarball — `npm install -g <url>`
#
# /vscode/ and /cli/ are permanent addresses (see assemble-site.sh).
# Triggered automatically on every push to main, plus a manual dispatch
# button for forced redeploys.
#
# One-time setup on GitHub:
#   Settings → Pages → Source → "GitHub Actions"
# Without that, the first deploy step fails with a clear "Pages not
# configured for Actions source" error.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages to claim the pages environment and
# request the OIDC token used to upload the artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one active Pages deploy. cancel-in-progress=false so a
# running deploy finishes (rather than getting interrupted mid-upload)
# before the next one starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            app/package-lock.json
            cli/package-lock.json
            vscode/package-lock.json

      # Every surface consumes the renderer from core/ (a file: dependency),
      # so core's own dependencies must be installed first.
      - name: Install core dependencies
        run: npm ci
        working-directory: core

      - name: Test core
        run: npm test
        working-directory: core

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Test app
        run: npm test
        working-directory: app

      - name: Build app
        run: npm run build
        working-directory: app

      # `npm test` in cli/ and vscode/ builds dist/ first (pretest), so the
      # files published below are the ones that were just tested.
      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Build + test CLI
        run: npm test
        working-directory: cli

      - name: Install extension dependencies
        run: npm ci
        working-directory: vscode

      - name: Build + test extension
        run: npm test
        working-directory: vscode

      - name: Assemble the site
        run: .github/scripts/assemble-site.sh _site

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
